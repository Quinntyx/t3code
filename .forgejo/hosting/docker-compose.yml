services:
  updates:
    image: nginx:1.28-alpine
    container_name: t3code-update-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:3081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - forgejo

networks:
  forgejo:
    external: true
    name: forgejo_default
