map $http_expo_runtime_version $t3code_runtime {
    default invalid;
    "~^[0-9a-f]{40}$" $http_expo_runtime_version;
}

server {
    listen 80;
    client_max_body_size 0;

    location ~ ^/api/packages/quinntyx/generic/t3code-mobile/(?<t3code_platform>android|ios)/manifest\.json$ {
        rewrite ^ /api/packages/quinntyx/generic/t3code-mobile/$t3code_platform-$t3code_runtime/manifest.json break;
        proxy_pass http://forgejo:3000;
        proxy_hide_header Content-Type;
        add_header Content-Type application/json always;
        add_header expo-protocol-version 1 always;
        add_header expo-sfv-version 0 always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://forgejo:3000;
        proxy_set_header Host $http_host;
    }
}
