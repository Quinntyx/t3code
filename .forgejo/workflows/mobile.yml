name: Fork mobile
on:
  workflow_call:
    inputs:
      build_android:
        description: Build a signed T3 Code Preview APK
        type: boolean
        default: true

jobs:
  updates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [android, ios]
    env:
      APP_VARIANT: production
      NODE_ENV: production
      EXPO_NO_DOTENV: "1"
      T3CODE_MOBILE_APP_ID: dev.quinntyx.t3code
      T3CODE_MOBILE_UPDATE_URL: https://araveia.tail985727.ts.net:8443/api/packages/quinntyx/generic/t3code-mobile/${{ matrix.platform }}/manifest.json
      MOBILE_ASSET_BASE_URL: https://araveia.tail985727.ts.net:8443/api/packages/quinntyx/generic/t3code-mobile/
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - uses: ./.forgejo/actions/setup
      - name: Verify update publication
        run: node --test .forgejo/scripts/*.test.cjs
      - name: Export and prepare a native-runtime-bound update
        run: |
          pnpm --dir apps/mobile exec expo export --platform ${{ matrix.platform }} --output-dir dist-fork
          node .forgejo/scripts/prepare-mobile.cjs ${{ matrix.platform }} apps/mobile/dist-fork mobile-feed
      - uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: t3code-mobile-${{ matrix.platform }}-update
          path: mobile-feed/
          if-no-files-found: error
      - name: Advance the tailnet mobile feed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          FORGEJO_SERVER_URL: ${{ github.server_url }}
          FORGEJO_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          git fetch origin main --depth=1
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo 'A newer main revision exists; leaving the live feed unchanged.'
            exit 0
          fi
          runtime="$(node -p 'require("./mobile-feed/manifest.json").runtimeVersion')"
          node .forgejo/scripts/publish.cjs mobile-feed t3code-mobile "${{ matrix.platform }}-$runtime"
      - name: Install Android build tools in the job container
        if: inputs.build_android && matrix.platform == 'android'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends openjdk-17-jdk unzip build-essential
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --location https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          printf 'y\n%.0s' {1..100} | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' platform-tools
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
      - name: Build the standalone Preview APK
        if: inputs.build_android && matrix.platform == 'android'
        env:
          APP_VARIANT: preview
          T3CODE_MOBILE_APP_ID: com.t3tools.t3code.preview
          T3CODE_MOBILE_UPDATES_ENABLED: "0"
        run: |
          set -euo pipefail
          pnpm --dir apps/mobile exec expo prebuild --platform android --no-install
          cd apps/mobile/android
          ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
          apk=app/build/outputs/apk/release/app-release.apk
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          badging="$("$build_tools/aapt" dump badging "$apk")"
          signature="$("$build_tools/apksigner" verify --print-certs "$apk")"
          test "$(awk -F"'" '/^package: name=/ {print $2; exit}' <<< "$badging")" = com.t3tools.t3code.preview
          test "$(awk -F"'" '/^application-label:/ {print $2; exit}' <<< "$badging")" = 'T3 Code Preview'
          test "$(awk -F': ' '/certificate SHA-256 digest/ {print $NF; exit}' <<< "$signature")" = fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c
      - uses: https://data.forgejo.org/actions/upload-artifact@v3
        if: inputs.build_android && matrix.platform == 'android'
        with:
          name: t3code-preview-android-arm64
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
